name: Destroy Infrastructure (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm destruction'
        required: true
        default: 'no'

jobs:
  destroy-eks:
    name: Limpeza Manual (Destruir EKS)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'yes' }}
    defaults:
      run:
        working-directory: infra/eks

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Atualizar kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name eks-officyna-service \
            --region ${{ secrets.AWS_REGION }}

      - name: Remover recursos do Kubernetes
        run: |
          kubectl delete -f ../../k8s/hpa.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/service.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/deployment.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/secret.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/configmap.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/kong-service-proxy.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/kong-service-admin.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/kong-deployment.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/kong-declarative-config.yaml --ignore-not-found=true

      - name: Aguardar remoção do LoadBalancer
        run: |
          echo "Aguardando a AWS remover o LoadBalancer..."
          sleep 180

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve

  destroy-db:
    name: Limpeza Manual (Destruir Banco)
    runs-on: ubuntu-latest
    needs: destroy-eks
    if: ${{ github.event.inputs.confirm == 'yes' }}
    defaults:
      run:
        working-directory: infra/db

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configurar Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"
