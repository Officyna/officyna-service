name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/officyna/officyna-service
  JAVA_VERSION: "21"

jobs:
  build-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Build e Testes
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compilar e executar testes (mvn verify)
        run: mvn --batch-mode --update-snapshots verify

      - name: Análise de qualidade (SonarCloud)
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          mvn --batch-mode sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=officyna \
            -Dsonar.projectKey=officyna-service

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  docker:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tags e metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # JOB: Deploy da Infraestrutura (Banco)
  # ==========================================
  deploy-db:
    name: Provisionar Banco de Dados (Terraform)
    outputs:
      documentdb_endpoint: ${{ steps.docdb.outputs.endpoint }}
    runs-on: ubuntu-latest
    needs: [docker, build-test]
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: infra/db
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Capturar endpoint do DocumentDB
        id: docdb
        run: |
          ENDPOINT=$(terraform output -raw docdb_endpoint)
          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT

  # ==========================================
  # JOB: Deploy da Infraestrutura (EKS)
  # ==========================================
  deploy-eks:
    name: Provisionar EKS (Terraform)
    runs-on: ubuntu-latest
    needs: [docker, build-test, deploy-db]
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: infra/eks
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

  # ==========================================
  # JOB: Deploy Aplicacao (Kubernetes)
  # ==========================================
  deploy-app:
    name: Deploy no Kubernetes
    runs-on: ubuntu-latest
    needs: [docker, deploy-db, deploy-eks]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Atualizar kube config
        run: aws eks update-kubeconfig --name eks-officyna-service --region us-east-1

      - name: Instalar metrics-server (necessário para o HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

      - name: Instalar envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Aplicar configmap
        run: |
          kubectl apply -f k8s/configmap.yaml

      - name: Verificar URI gerada
        env:
          DOCDB_ENDPOINT: ${{ needs.deploy-db.outputs.documentdb_endpoint }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          export MONGODB_URI="mongodb://officynasoatdbuser:${DB_PASSWORD}@${DOCDB_ENDPOINT}:27017/officyna?tls=true&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false"
          
          echo "$MONGODB_URI"

      - name: Mostrar secret gerado
        env:
          DOCDB_ENDPOINT: ${{ needs.deploy-db.outputs.documentdb_endpoint }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          export MONGODB_URI="mongodb://officynasoatdbuser:${DB_PASSWORD}@${DOCDB_ENDPOINT}:27017/officyna?tls=true&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false"
      
          envsubst < k8s/secret.yaml

      - name: Aplicar Secret
        env:
          DOCDB_ENDPOINT: ${{ needs.deploy-db.outputs.documentdb_endpoint }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          export MONGODB_URI="mongodb://officynasoatdbuser:${DB_PASSWORD}@${DOCDB_ENDPOINT}:27017/officyna?tls=true&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false"
          envsubst < k8s/secret.yaml | kubectl apply -f -

      - name: Criar imagePullSecret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ secrets.GHCR_USERNAME }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar Deployment, Service e HPA
        run: |
          sed -i "s|image: ${IMAGE_NAME}:latest|image: ${IMAGE_NAME}:${{ needs.docker.outputs.image_tag }}|" k8s/deployment.yaml          
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar rollout da aplicação
        run: |
          kubectl rollout status deployment/officyna-service --timeout=300s
          kubectl get pods,svc,hpa 

      - name: Logs da aplicação
        run: |
          kubectl logs deployment/officyna-service

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          echo "===== PODS ====="
          kubectl get pods -o wide
          
          echo "===== DESCRIBE POD ====="
          kubectl describe pod -l app.kubernetes.io/name=officyna
          
          echo "===== EVENTS ====="
          kubectl get events --sort-by=.metadata.creationTimestamp

      - name: Logs do Pod
        if: failure()
        run: |
          POD=$(kubectl get pods -l app.kubernetes.io/name=officyna -o jsonpath='{.items[0].metadata.name}')
          
          echo "===== POD ====="
          echo "$POD"
          
          echo "===== LOGS ATUAIS ====="
          kubectl logs $POD || true
          
          echo "===== LOGS ANTERIORES ====="
          kubectl logs $POD --previous || true
          
          echo "===== VARIÁVEIS ====="
          kubectl describe pod $POD
#
#  # ==========================================
#  # JOB: Limpeza Automática (Destruição EKS)
#  # ==========================================
  destroy-eks:
    name: Limpeza Automática (Destruir EKS)
    runs-on: ubuntu-latest
    needs: [ deploy-eks, deploy-app ]
    if: always() && needs.deploy-eks.result != 'skipped' && github.event_name == 'push'
    defaults:
      run:
        working-directory: infra/eks

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Atualizar kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name eks-officyna-service \
            --region us-east-1

      - name: Remover recursos do Kubernetes
        run: |
          kubectl delete -f ../../k8s/hpa.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/service.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/deployment.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/secret.yaml --ignore-not-found=true
          kubectl delete -f ../../k8s/configmap.yaml --ignore-not-found=true

      - name: Aguardar remoção do LoadBalancer
        run: |
          echo "Aguardando a AWS remover o LoadBalancer..."
          sleep 180

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve

  # ==========================================
  # JOB: Limpeza Automática (Destruição)
  # ==========================================
  destroy-db:
    name: Limpeza Automática (Destruir Banco)
    runs-on: ubuntu-latest
    needs: [deploy-db, deploy-app, destroy-eks]
    if: always() && needs.deploy-db.result != 'skipped' && github.event_name == 'push'
    defaults:
      run:
        working-directory: infra/db
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configurar Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"
