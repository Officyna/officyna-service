name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - developer
      - feature/subida-aplicacao-eks
  pull_request:
    branches:
      - main
      - developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/officyna/officyna-service
  JAVA_VERSION: "21"

jobs:
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compilar e executar testes (mvn verify)
        run: mvn --batch-mode --update-snapshots verify

      - name: Análise de qualidade (SonarCloud)
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          mvn --batch-mode sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=officyna \
            -Dsonar.projectKey=officyna-service

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  docker:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tags e metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # JOB: Deploy da Infraestrutura (Banco)
  # ==========================================
  deploy-db:
    name: Provisionar Banco de Dados (Terraform)
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'
#    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/subida-aplicacao-eks')
    defaults:
      run:
        working-directory: infra/db
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"

  # ==========================================
  # JOB: Deploy da Infraestrutura (EKS)
  # ==========================================
  deploy-eks:
    name: Provisionar EKS (Terraform)
    runs-on: ubuntu-latest
    needs: [build-test, deploy-db]
    if: github.event_name == 'push'
    #    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/125/provisionamento-banco-dados')
    defaults:
      run:
        working-directory: infra/eks
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

  # ==========================================
  # JOB: Deploy Aplicacao (Kubernetes)
  # ==========================================
  deploy-app:
    name: Deploy no Kubernetes
    runs-on: ubuntu-latest
    needs: [docker, deploy-db, deploy-eks]
    if: github.event_name == 'push'
#    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/125/provisionamento-banco-dados')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Atualizar kube config
        run: aws eks update-kubeconfig --name eks-officyna-service --region us-east-1

      - name: Instalar metrics-server (necessário para o HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

      - name: Instalar envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Aplicar configmap
        run: |
          kubectl apply -f k8s/configmap.yaml

      - name: Aplicar Secret
        env:
          MONGODB_URI: ${{ secrets.AWS_DOCUMENT_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          envsubst < k8s/secret.yaml | kubectl apply -f -

      - name: Aplicar Deployment, Service e HPA
        run: |
          sed -i "s|image: ${IMAGE_NAME}:latest|image: ${IMAGE_NAME}:${{ needs.docker.outputs.image_tag }}|" k8s/deployment.yaml          
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar rollout da aplicação
        run: |
          kubectl rollout status deployment/officyna-service --timeout=180s
          kubectl get pods,svc,hpa 

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          echo "===== PODS ====="
          kubectl get pods -o wide

