apiVersion: v1
kind: ConfigMap
metadata:
  name: officyna-configmap
  labels:
    app.kubernetes.io/name: officyna
  namespace: officyna
data:
  SPRING_PROFILES_ACTIVE: "default"
  SERVER_PORT: "8080"
  JWT_EXPIRATION: "86400000"
  LOG_LEVEL_APP: "INFO"
  LOG_LEVEL_SECURITY: "INFO"
  DATABASE_SEED_ENABLED: "true"