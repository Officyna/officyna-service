apiVersion: apps/v1
kind: Deployment
metadata:
  name: officyna-service
  namespace: officyna
  labels:
    app.kubernetes.io/name: officyna
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: officyna
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: officyna
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: officyna-service
          image: ghcr.io/officyna/officyna-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: officyna-config
            - secretRef:
                name: officyna-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3