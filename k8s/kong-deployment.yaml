apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  labels:
    app.kubernetes.io/name: kong
  namespace: officyna
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong
    spec:
      containers:
        - name: kong
          image: kong:latest
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
            - name: KONG_ADMIN_GUI_URL
              value: "http://localhost:8002"
          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8002
            - containerPort: 8444
          volumeMounts:
            - name: kong-declarative
              mountPath: /kong/declarative/kong.yml
              subPath: kong.yml
              readOnly: true
      volumes:
        - name: kong-declarative
          configMap:
            name: kong-declarative-config
            items:
              - key: kong.yml
                path: kong.yml
