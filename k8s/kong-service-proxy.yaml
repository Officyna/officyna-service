apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  labels:
    app.kubernetes.io/name: kong
  namespace: officyna
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: kong
  ports:
    - name: proxy-http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: proxy-ssl
      port: 8443
      targetPort: 8444
      protocol: TCP
